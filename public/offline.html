<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schoolink · 離線</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#191823;color:#e8e4ec;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;text-align:center}
  .box{max-width:320px;padding:30px}
  img{width:96px;height:96px;animation:float 4s ease-in-out infinite}
  h1{font-size:20px;margin:16px 0 6px}
  p{font-size:13px;color:#c8c4d0;line-height:1.7;margin:0 0 20px}
  button{padding:11px 20px;border-radius:12px;border:0;background:linear-gradient(135deg,#8b7bff,#4d94ff);
    color:#fff;font-weight:600;cursor:pointer}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="box">
  <img src="/logo.svg" alt="Schoolink">
  <h1>目前離線</h1>
  <p>網路恢復後，Schoolink 會自動重新連線並送出待發訊息。<br>You're offline — queued messages send automatically when you're back.</p>
  <button onclick="location.reload()">重試 / Retry</button>
</div>
</body>
</html>
